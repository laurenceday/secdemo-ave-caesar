name: ci

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: aave-v3-kelp

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build --sizes
      - run: forge test --no-match-path "test/fork/**" -vvv

  fork:
    # Activates when the repo has MAINNET_RPC_URL in secrets and
    # RUN_FORK_TESTS=true in variables. Needs an archive node with
    # April-May 2026 state; blocks are pinned in the fork test.
    if: ${{ vars.RUN_FORK_TESTS == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge test --match-path "test/fork/**" -vvv
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
